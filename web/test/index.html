<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfr · 测试报告</title>
<link rel="stylesheet" href="../app.css">
</head>
<body>
<div id="app" class="test-page">
  <header class="test-head">
    <div class="test-nav">
      <span class="brand-mark small">wfr</span>
      <span class="crumb-tip">测试报告 · 8 个测试套件</span>
      <span class="test-links">
        <a class="ghost" href="../">← 首页</a>
        <a class="ghost" href="../chat/">对话</a>
      </span>
    </div>
    <div class="stats" id="stats">
      <div class="stat-card total"><b>–</b><span>总用例</span></div>
      <div class="stat-card ok"><b>–</b><span>通过</span></div>
      <div class="stat-card bad"><b>–</b><span>失败</span></div>
      <div class="stat-card time"><b>–</b><span>耗时</span></div>
    </div>
  </header>
  <div id="tests-table" class="tests-scroll"></div>
</div>

<script src="test.js"></script>
</body>
</html>
