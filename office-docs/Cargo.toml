[package]
name = "rust_doc_engine"
version = "0.1.0"
edition = "2021"
description = "离线解析与生成 PDF/DOCX/XLSX/PPTX 的本地文档引擎，支持交叉编译为 Android so 并通过 JNI 供 Kotlin/Java 调用"
license = "MIT"

[lib]
name = "rust_doc_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.22"
calamine = "0.36"
rust_xlsxwriter = "0.99"
docx-rs = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.9", optional = true }

# 说明：原文档推荐 pptx-rs，但 crates.io 上的 pptx-rs 0.1.0 为空壳占位 crate
# （仅有 main.rs，无 library target，无法作为依赖）。改用自研最小 OOXML 生成器
# （office_writer::export_pptx，基于 zip crate 直接写 PPTX XML）。

[features]
default = ["pdf"]
# 关闭 pdf 特性可去掉 pdfium（Android 交叉编译无预编译 PDFium 库时的降级方案），so 体积显著减小
pdf = ["dep:pdfium-render"]

[profile.release]
lto = "thin"
opt-level = "z"
strip = true
